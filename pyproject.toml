[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicaltrials"
version = "0.1.0"
description = "A clean Python library for the ClinicalTrials.gov API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kyle Stringfellow"}]
keywords = ["clinical trials", "clinicaltrials.gov", "biotech", "pharma", "FDA", "medical research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7", "pytest-cov", "responses"]

[project.urls]
Homepage = "https://github.com/kstring99/clinicaltrials"
Documentation = "https://github.com/kstring99/clinicaltrials#readme"
Issues = "https://github.com/kstring99/clinicaltrials/issues"
